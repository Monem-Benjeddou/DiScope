name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet test -c Release

      - name: "Dogfood: DiScope on its own sample"
        if: matrix.os == 'ubuntu-latest'
        run: dotnet run --project src/DiScope.Cli -c Release -- samples/BuggyApi -f net8.0 --format text --fail-on none

      - name: VS Code extension smoke test
        if: matrix.os == 'ubuntu-latest'
        run: node editors/vscode/test/smoke.js "$PWD/src/DiScope.Cli/bin/Release/net8.0/discope.dll"

  pack:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet pack src/DiScope.Cli -c Release -o artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: artifacts/*.nupkg
