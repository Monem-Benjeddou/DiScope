version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: monthly
    # One pull request per month for all NuGet updates instead of one per package.
    groups:
      nuget:
        patterns: ["*"]
    ignore:
      # samples/LegacyWorker pins Microsoft.Extensions.* 9.x on purpose: it tests packages newer than the
      # .NET 8 shared framework, matching its EF Core 9 dependency.
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
