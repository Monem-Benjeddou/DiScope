name: Release

# Push a tag like v0.2.0 to publish. The package version comes from the tag.
# To retry a release (e.g. after fixing the NuGet key): Actions → Release → Run workflow, with the tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)publish, e.g. v0.1.1
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet test -c Release

      - name: Pack
        run: dotnet pack src/DiScope.Cli -c Release -o artifacts -p:Version=${TAG#v}

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" artifacts/*.nupkg --clobber
          else
            gh release create "$TAG" artifacts/*.nupkg --title "DiScope $TAG" --generate-notes --verify-tag
          fi

      - name: Publish to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        if: env.NUGET_API_KEY != ''
        run: dotnet nuget push artifacts/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

  extension:
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Package (version from the tag)
        working-directory: editors/vscode
        run: |
          node -e "const f='package.json',p=require('./'+f);p.version=process.env.TAG.replace(/^v/,'');require('fs').writeFileSync(f,JSON.stringify(p,null,2)+'\n')"
          npx --yes @vscode/vsce package --no-dependencies -o discope-${TAG#v}.vsix

      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" editors/vscode/*.vsix --clobber

      - name: Publish to the VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        if: env.VSCE_PAT != ''
        working-directory: editors/vscode
        run: npx --yes @vscode/vsce publish --no-dependencies --packagePath discope-${TAG#v}.vsix

      - name: Publish to Open VSX (Cursor, VSCodium)
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        if: env.OVSX_PAT != ''
        working-directory: editors/vscode
        run: npx --yes ovsx publish discope-${TAG#v}.vsix --pat "$OVSX_PAT"
